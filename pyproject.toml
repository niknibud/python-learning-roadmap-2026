[project]
name = "python-learning-roadmap-2026"
version = "0.1.0"
description = "Дорожная карта повышения знаний по Python"
authors = [
    {name = "Dubinkin Pavel",email = "pdubinkin@yandex.ru"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-benchmark (>=5.3.0,<6.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "psutil (>=7.2.2,<8.0.0)"
]
